version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: shortparse-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /storage/ShortParse-Redis:/data
    command: redis-server --appendonly yes --requirepass "shortparse_secure_cache_pass"
    restart: unless-stopped
